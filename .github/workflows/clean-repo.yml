name: Clean Repository

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grants the workflow permission to push commits back to the repository
permissions:
  contents: write

jobs:
  clean-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove all files except .github/workflows
        run: |
          # Enable globbing features to exclude specific paths
          shopt -s extglob dotglob
          
          # Remove everything in the root directory except .git and .github
          rm -rf !(.git|.github)
          
          # Remove everything inside .github except workflows
          if [ -d ".github" ]; then
            cd .github
            rm -rf !(workflows)
            cd ..
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add -A
          
          # Only commit if there are actual deletions to record
          if ! git diff --staged --quiet; then
            git commit -m "chore: remove all files except .github/workflows"
            git push
          else
            echo "Repository is already clean."
          fi
